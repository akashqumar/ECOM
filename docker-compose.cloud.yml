services:
  # ==========================================
  # DATABASE TIER: Multi-Database PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: user_db,catalog_db,order_db,inventory_db,payment_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-multi-postgres.sh:/docker-entrypoint-initdb.d/init-multi-postgres.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecom-cloud-network

  # ==========================================
  # CACHE TIER: Redis
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: ecom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecom-cloud-network

  # ==========================================
  # EVENT STREAMING: Apache Kafka (KRaft)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: ecom-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "4L622nShTUiBen8jgukUQA"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecom-cloud-network

  # ==========================================
  # SPRING BOOT MICROSERVICES
  # ==========================================
  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: user-service
    container_name: user-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  catalog-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: catalog-service
    container_name: catalog-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  cart-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: cart-service
    container_name: cart-service
    restart: always
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: inventory-service
    container_name: inventory-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: payment-service
    container_name: payment-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: notification-service
    container_name: notification-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: order-service
    container_name: order-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom-cloud-network

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.cloud
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      - user-service
      - catalog-service
      - cart-service
      - order-service
    networks:
      - ecom-cloud-network

networks:
  ecom-cloud-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
