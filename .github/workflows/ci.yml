name: CI/CD Pipeline - Build, Test & Dockerize

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Infrastructure Services (PostgreSQL, Redis, Kafka)
        run: |
          docker compose up -d postgres redis kafka
          
          echo "Waiting for PostgreSQL to be ready..."
          until docker compose exec -T postgres pg_isready -U postgres; do
            sleep 2
          done

          echo "Waiting for Redis to be ready..."
          until docker compose exec -T redis redis-cli ping; do
            sleep 2
          done

          echo "Ensuring all microservice databases exist..."
          for db in user_db catalog_db order_db inventory_db payment_db notification_db; do
            docker compose exec -T postgres psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 || \
            docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE $db;"
          done
          echo "All infrastructure services initialized successfully!"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Unit/Integration Tests
        run: |
          mvn clean test -Dspring.profiles.active=test

      - name: Teardown Infrastructure
        if: always()
        run: |
          docker compose down -v

  frontend-build:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build
